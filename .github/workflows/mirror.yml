name: Mirror to GitLab

on:
  push:
    branches: ["main"]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to GitLab
        uses: wangchucheng/git-repo-sync@v0.1.0
        with:
          target-url: https://gitlab.com/XiaoXioe/ci.git
          target-username: XiaoXioe
          target-token: ${{ secrets.GITLAB_TOKEN }}

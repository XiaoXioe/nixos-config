name: "Build and Cache Nix Packages"
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          install_url: https://nixos.org/nix/install

      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          name: cachixix
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/swift

      - name: Build cached packages
        run: |
          # Auto-discover packages dari packages-export.nix (single source of truth).
          # Tambah/hapus package di sana → CI otomatis mengikuti.
          PKGS=$(nix eval .#packages.x86_64-linux \
            --apply builtins.attrNames --json | \
            jq -r 'map(".#" + .) | join(" ")')
          if [ -z "$PKGS" ]; then
            echo "ERROR: nix eval returned empty package list" >&2
            exit 1
          fi
          # shellcheck disable=SC2086
          nix build $PKGS \
            ".#devShells.x86_64-linux.default" \
            ".#checks.x86_64-linux.pre-commit" \
            -L

      - name: Eval NixOS configuration (syntax check)
        run: |
          nix eval .#nixosConfigurations.KleinMoretti.config.system.build.toplevel.drvPath


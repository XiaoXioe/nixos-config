config_version = 12

[bar.default]
center = ["date"]
concave_edge_corners = false
end = ["group:g1", "group:g2", "tray"]
font_family = "FiraCode Nerd Font Ret"
font_weight = 400
margin_edge = 4
scale = 0.90000000596046448
shadow = false
start = [
    "control-center",
    "workspaces",
    "spacer_3",
    "taskbar",
    "spacer_1",
    "media",
]

[bar.default.dead_zone.actions]
scroll_down = "workspace-switch next"
scroll_up = "workspace-switch prev"

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
border = ""
enabled = true
fill = "surface_variant"
id = "g1"
members = ["cpu", "temp", "ram", "network_rx", "network_tx"]
opacity = 0.55000001192092896
padding = 6.0

[[bar.default.capsule_group]]
accordion = false
accordion_direction = "end"
enabled = true
fill = "surface_variant"
id = "g2"
members = ["notifications", "clipboard", "notes"]
opacity = 0.34999999403953552
padding = 6.0

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[[control_center.shortcuts]]
type = "power_profile"

[[control_center.shortcuts]]
type = "session"

[desktop_widgets]
schema_version = 2
widget_order = []

[desktop_widgets.grid]
cell_size = 8
major_interval = 4
visible = false

[desktop_widgets.widget]

[dock]
auto_hide = false
background_opacity = 0.84999998100101948
enabled = true
icon_size = 30
item_spacing = 0
launcher_icon = "snowflake"
launcher_position = "start"
magnification_scale = 1.5000000074505806
main_axis_padding = 12
pinned = [
    "codium",
    "foot",
    "org.kde.dolphin",
    "zen-beta",
    "io.github.kukuruzka165.materialgram",
    "com.discordapp.Discord",
    "eu.betterbird.Betterbird",
]
show_dots = true

[location]
auto_locate = true

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = ["lockscreen-login-box@HDMI-A-1"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
box_height = 196.0
box_width = 810.0
cx = 840.0
cy = 868.0
output = "HDMI-A-1"
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
center_password_text = false
input_opacity = 1.0
input_radius = 6.0
layout = "regular"
show_caps_lock = true
show_keyboard_layout = true
show_login_button = true
show_media = true
show_session_buttons = true
show_unlock_hint = true
show_weather = true

[plugin_settings."noctalia/notes"]
panel_open_near_click = true

[plugins]
enabled = ["noctalia/notes"]

[shell]
avatar_path = "/var/lib/AccountsService/icons/klein-moretti"
button_borders = false
font_family = "FiraCode Nerd Font Ret"
input_borders = false

[shell.launcher]
show_app_actions = true

[shell.launcher.providers.calculator]
prefix = ""

[shell.panel]
launcher_position = "bottom_center"
list_item_background = true

[shell.screenshot]
save_to_file = true

[system.monitor]
cpu_poll_seconds = 1

[theme]
builtin = "Catppuccin"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

[theme.templates]
enable_builtin_templates = false

[wallpaper]
fill_color = "primary"

[wallpaper.default]
path = "/home/klein-moretti/Pictures/Wallpapers/nord.jpeg"

[wallpaper.last]
path = "/home/klein-moretti/Pictures/Wallpapers/nord.jpeg"

[wallpaper.monitors.HDMI-A-1]
path = "/home/klein-moretti/Pictures/Wallpapers/nord.jpeg"

[widget.active_window]
enabled = false

[widget.control-center]
color = "primary"
glyph = "snowflake"

[widget.cpu]
visualization = "none"

[widget.date]
format = "{:%a %d %b %H:%M}"

[widget.launcher]
enabled = false
glyph = "snowflake"

[widget.network_rx]
network_speed_compact = true
visualization = "none"

[widget.network_tx]
network_speed_compact = true
visualization = "none"

[widget.notes]
type = "noctalia/notes:notes"

[widget.ram]
visualization = "none"

[widget.spacer_2]
type = "spacer"

[widget.spacer_3]
type = "spacer"

[widget.temp]
interactive = false
show_value = true
visualization = "none"

[widget.tray]
capsule_fill = "surface_variant"
capsule_radius = 8

[widget.workspaces]
show_labels = false
style = "focus_hint"

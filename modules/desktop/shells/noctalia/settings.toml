config_version = 13

[bar.default]
center = [ "cpu", "temp", "ram", "network_rx", "network_tx" ]
end = [ "tray", "clock", "notifications", "clipboard", "bluetooth", "brightness", "battery", "session" ]
start = [ "control-center", "workspaces", "media" ]

[dock]
enabled = true
icon_size = 36
launcher_icon = "snowflake"
launcher_position = "start"
pinned = [
    "codium",
    "org.kde.dolphin",
    "foot",
    "zen-beta",
    "io.github.kukuruzka165.materialgram",
    "discord",
    "io.ente.auth",
    "bitwarden",
    "eu.betterbird.Betterbird"
]
show_dots = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 840.0
    cy = 868.0
    output = "HDMI-A-1"
    placement_height = 1050.0
    placement_width = 1680.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell.launcher]
pinned = [ "org.kde.dolphin" ]

[theme]
source = "wallpaper"

[wallpaper.default]
path = "/mnt/data_btrfs/Pictures/Wallpapers/nord.jpeg"

[wallpaper.last]
path = "/mnt/data_btrfs/Pictures/Wallpapers/nord.jpeg"

[wallpaper.monitors.HDMI-A-1]
path = "/mnt/data_btrfs/Pictures/Wallpapers/nord.jpeg"

[widget.control-center]
glyph = "snowflake"

[widget.cpu]
visualization = "none"

[widget.network_rx]
visualization = "none"

[widget.network_tx]
visualization = "none"

[widget.ram]
visualization = "none"

[widget.temp]
visualization = "none"